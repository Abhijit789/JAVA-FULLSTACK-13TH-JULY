<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            padding: 0px;
            margin: 0px;
            box-sizing: border-box;
        }
        .frame{
            height: 100vh;
            width: 100vw;
            background-color: black;
            /* border: 1px solid white; */
            color: white;
            /* z-index: -1; */
        }
        #frame1{
            position: absolute;
            width: 50%;
            height: 60vh;
            margin-top: 20vh;
            background-color: rgba(256,256,256,0.1);
            margin-left: 10%;
            border-radius: 20px;
            box-shadow: 0px 0px 5px white,0px 0px 10px white,0px 0px 15px white,0px 0px 20px white,0px 0px 25px white;
        }

        #frame2{
            background-image: url("./steve_jobs_PNG33450.png");
            background-repeat: no-repeat;
        }
    </style>
</head>
<body>
    <div class="frame" id="frame1"></div>
    <div class="frame" id="frame2"></div>
</body>
</html>
