<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .parent{
            height: 70px;
            width: 700px;
            margin: auto;
            /* border: 1px solid; */
            margin-top: 20px;
            display: flex;
            justify-content: space-around;
            align-items: center;
            box-shadow: 0px 0px 5px grey,0px 0px 10px grey;
            border-radius: 40px;


        }
        .parent>.child{
            border: none;
        }

        .parent>#child1{
            height: 50px;
            /* border: 1px solid; */
            width: 50px;
        }
        .parent>#child2{
            width: 500px;
            /* border: 1px solid; */
            height: 50px;
        }
        .parent>#child3{
            height: 50px;
            width: 50px;
            /* border: 1px solid; */
        }
        .parent>#child4{
            height: 50px;
            width: 50px;
            /* border: 1px solid; */
        }

        #child2>input[type="search"]{
            width: 480px;
            height: 40px;
            margin: 5px 10px;
            /* background-color: red; */
            border: none;
            outline: none;
            font-size: 20px;
            color:skyblue;
            text-align: center;

        }

        input[type="search"]::placeholder{
            text-align: center;
        }

        .parent>.commonchild{
            box-shadow: 0px 0px 5px grey;
            border-radius: 50%;
        }
        
        .textparent{
            /* border: 1px solid; */
            height: 100px;
            width: 300px;
            margin: auto;
            margin-top: 150px;
        }
        span{
            font-size: 50px;
            font-weight: bold;
            line-height: 100px;
            font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
            
        }
        #g{
            color: rgb(3, 160, 251);
        }
        .o{
            color: red;
        }
        #o{
            color: yellow;
        }
        #l{
            color: green;
        }
        #e{
            color: red;
        }
    </style>
</head>
<body>
    <div class="textparent">
         <span id="g">G</span>
         <span class="o">O</span>
         <span id="o">O</span>
         <span id="g">G</span>
         <span id="l">L</span>
         <span id="e">E</span>
    </div>
    <div class="parent" id="parent">
        <div class="child commonchild" id="child1">

        </div>
        <div class="child" id="child2">
            <input type="search" name="" id="" placeholder="search">
        </div>
        <div class="child commonchild" id="child3"></div>
        <div class="child commonchild" id="child4"></div>
    </div>
</body>
</html>
