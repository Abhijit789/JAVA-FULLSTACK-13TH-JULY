<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
          .parent{
            height: 100vh;
            width: 100vw;
            background-color: aqua;
            border: 1px solid;
          }
          .child{
            height: 100px;
            width: 100px;
            border: 1px solid;

          }
          @media (min-width:576px) and (max-width:767px){
             .small{
                display: none;
             }
          }

          @media (min-width:767px) and (max-width:992px){
             .medium{
                display: none;
                /* background-color:grey; */
                
               
             }
             .child{
                background-color: grey;
                 box-shadow: 0px 0px 5px white,0px 0px 5px white,0px 0px 10px white,0px 0px 15px white,0px 0px 20px white,0px 0px 25px white,;
                  border: none;
             }
             .parent{
                background-color: black;
             }
          }
    </style>
</head>
<body>
    <div class="parent">
        <div class="child deskstop" id="child1">CHILD- 1</div>
        <div class="child small" id="child2">CHILD- 2</div>
        <div class="child small medium" id="child3">CHILD- 3</div>
    </div>
</body>
</html>
