<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            padding: 0px;
            margin: 0px;

        }
        main{
            width: 100vw;
            height: 100vh;
            background-color: black;
        }
        main header nav{
            padding: 25px 50px;
            background-color: #333;
        }
        main header nav ul{
            /* background-color: #ff00ff; */
            margin-left: 75%;
        }
        main header nav ul li{
            display: inline-block;
            margin-left: 10px

        }

        main header nav ul li a{
            
            padding: 12px 18px;
            background-color: white;
            text-decoration: none;
            border-radius: 5px;
            transition: all 1s;
        }

        main header nav ul li a:hover{
            background-color:#000000;
             border-radius: 15px;
            color: white;
            box-shadow: 0px 0px 5px white,0px 0px 10px white;
        }

        main header nav ul li a:active{
            color: yellow;
        }

        main header nav ul li a:visited{
            color:pink;
        }
    </style>
</head>
<body>
    <main>
        <header>
            <nav>
                <ul>
                    <li><a href="#">Home</a></li>
                    <li><a href="https://www.amazon.com">About</a></li>
                    <li><a href="#">Contact</a></li>
                </ul>
            </nav>
        </header>
    </main>
</body>
</html>
