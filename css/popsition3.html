<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .box{
            height: 100vh;
            width: 100%;
            background-color: aqua;
        }
        .child{
            height: 200px;
            width: 200px;
            position: fixed;
            bottom: 0px;
            right: 200px;
            background-color: pink;
            box-shadow: 0px 0px 5px grey,0px 0px 10px grey;
            border-radius: 5px;
            text-align: center;
            line-height: 200px;

        }
    </style>
</head>
<body>
    <div class="box">
        <div class="child">
             <h2>Child Dialogue Box</h2>
        </div>
    </div>
</body>
</html>
